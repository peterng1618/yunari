name: CI

on:
  push:
    # `develop` is the integration branch this work lands on, and it had no CI
    # signal at all — which is how four missing licence notices and a red
    # `format:check` both went unseen (vg-385).
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # vg-282: the rebuild and display suites take too long for every push (the
    # display one alone measured 11.4 minutes), so they run on the nightly
    # schedule and on demand rather than per commit.
    - cron: '0 3 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (renderer, player)
    # The nightly run is for the two slow suites below; this job's steps repeat
    # per-push work, so the schedule leaves them alone.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v4
        with:
          # The parity gate dates a licence by the commit the rule it quotes
          # entered (`tests/e2e/mockup-values.test.ts`), and a depth-1 clone
          # answers every history query with the boundary commit — every licence
          # would read as written by its own citing commit. This job runs
          # `npm run gate`, so it is the one that needs the history; the ledger
          # refuses a shallow tree loudly rather than manufacturing findings.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # vitest 5 requires ^22.12 || ^24 || >=26 — pin to an LTS the toolchain
          # actually supports rather than "latest", which can be an odd release.
          node-version: '24'
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - run: npm ci

      - name: Gate
        # D1's ruling (2026-10-12), recorded on vg-213, vg-262, vg-372, vg-355
        # and vg-379: `biome check` is the gate, not `format:check` + `lint`.
        # organizeImports is an assist action that only `check` runs, so a file
        # whose imports were unsorted passed both of the steps this replaces.
        # `npm run gate` is `biome check`, `gates:self-test`, `design:check` and
        # the unit suite. The suite is in the command because the gate list
        # carried no test run at all and a task closed with `vitest run` red
        # (vg-323). `design:check` is in it because an unrun gate and a green
        # gate look identical from outside (vg-355) -- and because it ran only
        # as a step of this workflow, a local `npm run gate` read green over a
        # red live-tree verdict (vg-435). No step here repeats either one.
        run: npm run gate

      - name: Status handoff
        run: npm run status:check

      - name: Agent hook self-checks
        # The hook script swallows every error so a hook can never block
        # compaction, which also means a broken one is silent. This is the only
        # thing that runs its self-check.
        run: npm run hooks:check

      - name: Typecheck
        # The npm script, not a hand-written list. The list was enumerated here
        # and drifted twice: it said "five projects, not four" because the host
        # had been missed, and it was still five once `scene-fabric` became the
        # sixth — so a type error in `chart-object.ts` passed CI. `npm run
        # typecheck` derives the projects from the workspaces field, which is
        # the only copy that cannot fall behind `package.json`.
        run: npm run typecheck

      # The unit suite is not a step of its own: `npm run gate` above runs it, so
      # a second `npx vitest run` here would run the same suite twice per job.

      - name: Build display-only player
        run: npx vite build packages/player

      - name: Build editor
        # Not optional and not only for the editor's own tests: Playwright starts
        # every `webServer` in its config regardless of which project runs, and
        # `vite preview` on an unbuilt package cannot start. `dist/` is
        # gitignored, so a fresh checkout has nothing until this step runs.
        run: npx vite build packages/editor

      - name: Build editor control fixture
        # The design-language parity gate previews `packages/editor` and loads
        # `/control-fixture.html`. `npm run build:fixture` is a second invocation
        # into the same `dist` with `emptyOutDir: false` (vite.config.fixture.ts),
        # so a fresh checkout needs it or the page SPA-falls back to `index.html`
        # and the design-language specs fail at their `[data-fixture-root]` assert.
        # Deliberately NOT chained into `npm run build` — the fixture must stay
        # out of the editor's production output.
        run: npm run build:fixture -w @yunari/editor

      - name: Build host
        # Not previewed by Playwright, so this is not the webServer trap — but
        # the bin shim refuses to start without dist/, so a build break here is
        # invisible until someone runs `yunari`.
        run: npx vite build packages/host

      - name: Enforce display-only bundle budget (§47)
        # Fails if an editor dependency leaks into the player.
        run: node packages/player/scripts/check-size.mjs

      # Only Chromium: these tests assert structure and behaviour, not pixels,
      # so a second engine would triple the install time to re-check the same
      # DOM. Cross-browser and real-device coverage is Gate 0 work on named
      # reference hardware (§126).
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Display tests (browser)
        # Every project, not just desktop-chromium: the host specs live in their
        # own serial projects now, so naming one project would silently drop them.
        #
        # `xvfb-run` because two specs launch a **headed** browser on purpose:
        # `host-secure-origin.spec.ts` reads a wake lock, which Chromium refuses
        # headless, and `host-pwa.spec.ts` installs a persistent profile. Without
        # a display those launch calls fail as "Missing X server or $DISPLAY",
        # which is a fact about the runner rather than about the product.
        run: xvfb-run --auto-servernum npx playwright test

  licences:
    name: Licence notices present
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every declared dependency must appear in THIRD-PARTY-NOTICES.md
        # §157 requires a complete licence inventory; §132/§161 require notices
        # to survive into packages.
        #
        # The names are DERIVED from the workspace manifests. They used to be a
        # hardcoded list of three, two of which were not dependencies at all
        # (an external executable and a package deliberately refused), so the
        # check would have failed if someone tidied away a notice for something
        # never installed — while missing every dependency actually added.
        #
        # `resolve()` is not decoration. `find` hands this script a RELATIVE
        # path, and `require('src/web/package.json')` is a bare specifier to
        # Node, so it threw MODULE_NOT_FOUND for every manifest — leaving
        # `names` empty, the loop unentered and the job exiting 0 having
        # verified nothing at all. It reported green from the day it was
        # written until 2026-09-15. A guard that cannot fail is worse than no
        # guard, so the last step here asserts that it found something.
        run: |
          set -euo pipefail
          missing=0
          names=$(find src/web -name package.json -not -path '*/node_modules/*' -exec node -e '
              const { resolve } = require("node:path");
              const p = require(resolve(process.argv[1]));
              for (const k of Object.keys({ ...p.dependencies, ...p.devDependencies })) {
                if (!k.startsWith("@yunari/")) console.log(k);
              }
            ' {} \; | sort -u)

          if [ -z "$names" ]; then
            echo "::error::derived no dependency names at all — this check is broken, not passing"
            exit 1
          fi

          echo "checking notices for: $(echo "$names" | tr '\n' ' ')"

          for name in $names; do
            if ! grep -qiF "$name" THIRD-PARTY-NOTICES.md; then
              echo "::error::$name is declared in a package.json but not mentioned in THIRD-PARTY-NOTICES.md"
              missing=1
            fi
          done
          exit $missing

  slow-suites:
    name: Rebuild and display suites (nightly, or on demand)
    # vg-282, ruled 2026-10-12: WIRE BOTH SUITES, BUT NOT ON EVERY PUSH.
    # `playwright.config.ts` `testIgnore`s both spec sets, and nothing passed
    # `--config`, so three reds were reachable only by a hand-typed command while
    # every gate reported green. The display suite alone measured 11.4 minutes.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - run: npm ci

      # Both suites preview a built editor; the display proof starts a real host
      # itself (its themes directory is written by the test), so the host's dist
      # has to exist too. `vite preview` on an unbuilt package cannot start.
      - name: Build editor
        run: npx vite build packages/editor

      - name: Build host
        run: npx vite build packages/host

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # One suite at a time: each takes its own preview port, and two concurrent
      # suites on a shared machine produce false results rather than slow ones.
      - name: Rebuild suite
        run: npm run test:rebuild

      - name: Display suite
        run: npm run test:display
