name: Visual evidence

on:
  workflow_dispatch:
    inputs:
      grep:
        description: Playwright title regex for the affected visual capture
        required: true
        type: string
      project:
        description: Playwright project (desktop-chromium, phone-chromium or desktop-host)
        default: desktop-chromium
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: visual-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    env:
      YUNARI_CAPTURE: '1'
      YUNARI_CAPTURE_DIR: test-results/screenshots
      YUNARI_GREP: ${{ inputs.grep }}
      YUNARI_PROJECT: ${{ inputs.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - run: npm ci
      - run: npx vite build packages/player
      - run: npx vite build packages/editor
      - run: npx playwright install --with-deps chromium
      - name: Capture selected visual evidence
        run: npx playwright test --project="$YUNARI_PROJECT" --grep "$YUNARI_GREP"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: visual-evidence
          path: src/web/test-results/screenshots/
          if-no-files-found: error
