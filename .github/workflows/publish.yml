name: Publish

# Tag-driven release: gate, build, stage, smoke-test the installed tarball,
# publish to npm, then attach the tarball and a staged-tree zip to the GitHub
# Release (decision D6).
#
# Triggers. `release: published` fires when release-please creates the release;
# `workflow_dispatch` exists because a release created with the default
# GITHUB_TOKEN does not trigger workflows. With a RELEASE_PLEASE_TOKEN PAT or
# GitHub App token configured in release.yml, publication is automatic; without
# one, an owner dispatches this workflow manually on the tag. Manual dispatch
# assumes a `vX.Y.Z` tag ref: `${GITHUB_REF_NAME#v}` strips that prefix and
# `--expect-version` then cross-checks the tag against src/web/package.json.
# `dry_run` defaults to true and any dispatch that does not explicitly pass
# `false` stays a dry run, so neither a publish nor an asset upload can happen
# by omission; a real manual run needs the GitHub Release for that tag to exist
# already (`gh release upload` targets it). A non-dry manual dispatch off a tag
# is refused in `install`'s first step, and `publish` inherits that refusal
# through `needs`.
#
# Jobs. `install` builds and proves the tarball with read-only contents;
# `publish` only downloads it, and holds the two permissions the publish path
# needs: `id-token: write` for provenance and `contents: write` for the release
# upload. The staged tree is built once, in `install`, and travels as an
# artifact.
#
# npm authentication. Trusted publishing is configured on an EXISTING package's
# npmjs.com settings, so it cannot be set up before `yunari` exists — and this
# workflow wires no token: no `registry-url` on setup-node, no `NODE_AUTH_TOKEN`
# on the publish step. The FIRST publish is therefore a one-time local,
# token-authenticated publish by the owner (stage, `npm pack`, `npm publish
# <tarball>`, upload the assets by hand), never a run of this workflow. The
# trusted publisher for repository `peterng1618/yunari`, workflow `publish.yml`
# takes effect from the SECOND publish on, and `publish.yml` must exist on the
# default branch for that binding to be offered. Provenance needs a public
# repository, `id-token: write`, and npm >= 11.5.1 (the Node 24 pinned here
# resolves an npm newer than that). The full runbook is docs/engineering/releases.md.
#
# `/editor` is a 302 to `/editor/` (relative asset base), so the smoke request
# follows redirects and still requires a final 200.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Gate, build, stage, smoke and run npm publish --dry-run without uploading assets
        type: boolean
        default: true

# Fail closed: only an explicit `false` from a dispatch publishes. Loose
# equality cannot tell `false` from a missing input (both coerce to 0), so
# compare the serialised value: release -> false, dispatch true -> true,
# dispatch false -> false, dispatch absent -> null -> dry run. Workflow level so
# both jobs read the same decision.
env:
  DRY_RUN: "${{ github.event_name == 'workflow_dispatch' && toJSON(inputs.dry_run) != 'false' ? 'true' : 'false' }}"

concurrency:
  # One publish at a time, whatever the ref: the version is only known inside
  # the job, so a ref-scoped group can still let a dispatch on `main` and a
  # dispatch on the tag reach `npm publish` together. Serialising the whole
  # workflow is the shortest guarantee that only one real publish runs.
  group: publish

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Contents only: this job never writes to the repository or the registry.
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      dist_tag: ${{ steps.version.outputs.dist_tag }}
    env:
      STAGE: ${{ runner.temp }}/yunari-package
      ASSETS: ${{ runner.temp }}/yunari-assets
      SMOKE: ${{ runner.temp }}/yunari-smoke
    steps:
      # First, so a non-dry manual dispatch off a tag spends nothing. `publish`
      # inherits the refusal through `needs`, which is why there is no copy
      # there.
      - name: Refuse a non-dry manual dispatch off a tag
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$DRY_RUN" != "true" && "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "a non-dry workflow_dispatch must run on a refs/tags/v* ref (got $GITHUB_REF)" >&2
            exit 1
          fi

      # The gate dates licence rules by commit history, so a shallow clone
      # would make every rule read as written by its own citing commit.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # vitest 5 requires ^22.12 || ^24 || >=26; Node 24 is the LTS the
          # existing CI job pins.
          node-version: "24"
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Install the workspace
        working-directory: src/web
        run: npm ci

      - name: Gate
        working-directory: src/web
        run: npm run gate

      - name: Build player, editor and host
        working-directory: src/web
        run: |
          set -euo pipefail
          npm run build -w @yunari/player
          npm run build -w @yunari/editor
          npm run build -w @yunari/host

      - name: Resolve version and dist-tag
        id: version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ "$version" == *-* ]]; then
            dist_tag=next
          else
            dist_tag=latest
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "DIST_TAG=$dist_tag" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"

      - name: Stage the package outside the repository
        run: |
          set -euo pipefail
          rm -rf "$STAGE"
          node scripts/stage-npm-package.mjs --out "$STAGE" --expect-version "$VERSION"

      - name: Pack the tarball
        run: |
          set -euo pipefail
          rm -rf "$ASSETS"
          mkdir -p "$ASSETS"
          (cd "$STAGE" && npm pack --pack-destination "$ASSETS")
          test -f "$ASSETS/yunari-${VERSION}.tgz"

      # The tarball is what users install; a missing entry here is a broken
      # release that the install smoke test alone would not explain.
      - name: Verify the tarball contents
        run: |
          set -euo pipefail
          entries="$(tar -tzf "$ASSETS/yunari-${VERSION}.tgz")"
          for path in \
            package/package.json \
            package/LICENSE \
            package/THIRD-PARTY-NOTICES.md \
            package/packages/host/bin/yunari.js \
            package/packages/host/dist/main.js \
            package/packages/host/public/library.html \
            package/packages/host/public/pair.html \
            package/packages/host/public/settings.html \
            package/packages/player/dist/index.html \
            package/packages/editor/dist/index.html \
            package/packages/host/vendor/weather-icons/clear-day.svg \
            package/schema/theme-document.schema.json; do
            if ! grep -qx "$path" <<< "$entries"; then
              echo "missing $path in the tarball" >&2
              exit 1
            fi
          done

      # Install the packed tarball the way a user would, in a directory with no
      # workspace above it, then boot the host and require every page to answer.
      - name: Install and smoke-test the tarball
        run: |
          set -euo pipefail
          rm -rf "$SMOKE"
          mkdir -p "$SMOKE"
          cd "$SMOKE"
          npm init --yes > /dev/null
          npm install --no-audit --no-fund "$ASSETS/yunari-${VERSION}.tgz"

          installed="$(./node_modules/.bin/yunari --version)"
          if [[ "$installed" != "$VERSION" ]]; then
            echo "installed yunari reports $installed, expected $VERSION" >&2
            exit 1
          fi

          port=4319
          ./node_modules/.bin/yunari --no-browser --port "$port" > "$SMOKE/host.log" 2>&1 &
          host_pid=$!
          trap 'kill "$host_pid" 2>/dev/null || true; wait "$host_pid" 2>/dev/null || true' EXIT

          for attempt in {1..60}; do
            if curl --silent --fail --output /dev/null --max-time 1 "http://127.0.0.1:${port}/api/health"; then
              break
            fi
            if ! kill -0 "$host_pid" 2>/dev/null; then
              echo "host exited before it answered; log follows" >&2
              cat "$SMOKE/host.log" >&2
              exit 1
            fi
            if [[ "$attempt" == 60 ]]; then
              echo "host did not answer within 60s; log follows" >&2
              cat "$SMOKE/host.log" >&2
              exit 1
            fi
            sleep 1
          done

          check() {
            local code
            code="$(curl --silent --show-error --location --max-time 10 \
              --output /dev/null --write-out '%{http_code}' \
              "http://127.0.0.1:${port}$1")"
            if [[ "$code" != "200" ]]; then
              echo "GET $1 returned $code, expected 200; log follows" >&2
              cat "$SMOKE/host.log" >&2
              exit 1
            fi
          }
          check /api/health
          check /editor
          check /
          # The icons are read from `<dist>/../vendor`, so an installed package
          # that omits them answers 404 here rather than in a user's theme.
          check /api/weather/icon/clear-day.svg

      # The zip is a release asset like the tarball, so it is made from the same
      # staged tree rather than rebuilt in the publish job.
      - name: Zip the staged tree
        run: |
          set -euo pipefail
          (cd "$STAGE" && zip -q -r "$ASSETS/yunari-${VERSION}.zip" .)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: yunari-release-assets
          path: ${{ runner.temp }}/yunari-assets
          if-no-files-found: error

  publish:
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Provenance signs with the OIDC token; the release upload writes assets.
      contents: write
      id-token: write
    env:
      ASSETS: ${{ runner.temp }}/yunari-assets
      VERSION: ${{ needs.install.outputs.version }}
      DIST_TAG: ${{ needs.install.outputs.dist_tag }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: yunari-release-assets
          path: ${{ runner.temp }}/yunari-assets

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Provenance needs npm >= 11.5.1, and the runner's bundled npm may be
          # older. No cache or install: this job builds nothing.
          node-version: "24"

      - name: Publish the packed tarball to npm
        run: |
          set -euo pipefail
          args=(--provenance --access public --tag "$DIST_TAG")
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          npm publish "$ASSETS/yunari-${VERSION}.tgz" "${args[@]}"

      - name: Attach the release assets
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout in this job; `gh` takes the repository from here.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" \
            "$ASSETS/yunari-${VERSION}.tgz" \
            "$ASSETS/yunari-${VERSION}.zip" \
            --clobber
