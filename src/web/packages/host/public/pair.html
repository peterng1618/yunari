<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Yunari — pair this display</title>
    <!-- The mark the player bundle serves at its own root. The settings page's
         copy lives under `/settings`, which is loopback-only — and this page is
         opened by a device that has not paired yet, from the network. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      /* Its own sheet, not `/settings/yunari-page.css`: that route is an admin
         surface and refuses the very device this page is for. The palette is
         the host's, copied the way the first-run page copies it. */
      :root {
        --paper: #f5f1e8;
        --ink: #14120e;
        --line: #14120e;
        --muted: #5a5449;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #14161c;
          --ink: #e8ecf3;
          --line: #2a3242;
          --muted: #8a97ab;
        }
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        background: var(--paper);
        color: var(--ink);
        font: 15px/1.6 system-ui, sans-serif;
        padding: 24px;
      }
      main {
        max-width: 30em;
        margin: 0 auto;
      }
      h1 {
        font-size: 20px;
        letter-spacing: 0.02em;
        margin: 0 0 8px;
      }
      p {
        color: var(--muted);
        margin: 0 0 16px;
      }
      label {
        display: block;
        margin: 16px 0 4px;
        font-size: 13px;
      }
      input,
      button {
        width: 100%;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: transparent;
        color: inherit;
        font: inherit;
      }
      #code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 22px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
      }
      button {
        margin-top: 20px;
        background: var(--ink);
        color: var(--paper);
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      #status {
        margin-top: 16px;
        color: var(--muted);
      }
      #status[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Pair this display</h1>
      <p>
        Type the code this PC is showing. It is six characters, and it lasts a
        few minutes.
      </p>
      <form>
        <label for="code">Pairing code</label>
        <input
          id="code"
          name="code"
          autocomplete="off"
          autocapitalize="characters"
          spellcheck="false"
          required
        />
        <label for="name">Name this display</label>
        <input
          id="name"
          name="name"
          type="text"
          maxlength="64"
          autocomplete="off"
          placeholder="Kitchen tablet"
          required
        />
        <button type="submit">Pair</button>
      </form>
      <p id="status" role="status" aria-live="polite" hidden></p>
    </main>
    <script>
      // Plain DOM, no framework and no build step: this page is opened by a
      // device with no credential, and it has to work with nothing but the
      // host's own bytes.
      const form = document.querySelector("form");
      const code = document.querySelector("#code");
      const name = document.querySelector("#name");
      const submit = document.querySelector("button");
      const status = document.querySelector("#status");

      const say = (message) => {
        status.textContent = message;
        status.hidden = false;
      };

      // The QR carries the code, so a device that scanned it has nothing to
      // type; a code read off the screen and typed in is uppercased and the
      // spaces a person reads into it are dropped.
      const offered = new URLSearchParams(location.search).get("code");
      if (offered === null) {
        code.focus();
      } else {
        code.value = offered;
        name.focus();
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        submit.disabled = true;
        say("Pairing…");

        try {
          const answer = await fetch("/api/pairing/claim", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              code: code.value.replace(/[^A-Za-z0-9]/g, "").toUpperCase(),
              label: name.value.trim(),
            }),
          });

          if (!answer.ok) {
            // The host's own words, and the same words however the code failed:
            // a page that said more than the host does would be the leak.
            say((await answer.text()).trim() || "That did not pair.");
            return;
          }

          const { token } = await answer.json();
          // The token is exchanged once for an HttpOnly cookie, so it never
          // reaches the address bar or a screenshot of it. The host answers
          // the exchange with a redirect the browser follows to the display.
          const exchanged = await fetch("/api/session", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ token }),
          });

          if (!exchanged.ok) {
            say((await exchanged.text()).trim() || "That did not pair.");
            return;
          }

          // The fresh credential is the cookie, which this page cannot read;
          // a record left here is the token from *before* the re-pair, and the
          // player would offer it as its fallback on the next load. Clearing it
          // is best-effort: a storage that refuses still has a valid cookie.
          try {
            localStorage.removeItem("yunari.display.pairing");
          } catch {
            // Quota or a private window; the exchange still succeeded.
          }

          location.replace("/");
        } catch {
          say("The host did not answer.");
        } finally {
          submit.disabled = false;
        }
      });
    </script>
  </body>
</html>
