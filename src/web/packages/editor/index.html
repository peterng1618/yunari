<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Yunari — editor</title>
    <!-- Relative for the same reason the bundle's own base is: the host mounts
         this document under `/editor/`, where an absolute path would resolve
         against the player's dist and 404. Without a link the browser probes
         `/favicon.ico` instead and logs the 404 on every load. -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <style>
      /* Pre-shell paint only: `editor-shell.css` owns every panel/control
         token once React mounts. These keep the first frame from flashing, so
         they are the palette `systemShellPalette` resolves and not a third one:
         `light` here — the two literals are that palette's `--shell-backdrop`
         and `--shell-text`, below — and `graphite` in the media query under it.
         The frame after `applyShellPalette` is therefore the frame before it. */
      html, body, #app {
        margin: 0;
        height: 100%;
        background: linear-gradient(145deg, #d8ebe4, #afd4d1);
        color: #102119;
        font: 13px/1.5 system-ui, sans-serif;
        overflow: hidden;
      }
      /* A dark-OS author's first frame, before React has resolved the palette:
         graphite's `--shell-backdrop` and `--shell-text`, which is what the
         stylesheet's own dark base block paints. A *stored* palette still
         flashes this rather than itself, because the block reads no storage and
         a second owner of the mapping was rejected. The cost of that
         is one frame; the cost of the alternative was the mapping existing in
         two places and drifting. */
      @media (prefers-color-scheme: dark) {
        html, body, #app { background: #0b0e12; color: #e8ecf3; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/editor-main.ts"></script>
  </body>
</html>
