<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Yunari — control fixture</title>
    <!-- The design-language parity fixture: the *built* control set mounted
         over the *built* stylesheet in a real browser — hit areas, contrast,
         forced colours and layout at 200% zoom, none of which jsdom can carry.
         It is built by its own invocation
         (`vite.config.fixture.ts`, `npm run build:fixture`) rather than by
         `npm run build`, so the shipped editor emits neither this page nor its
         bundle and `index.html` keeps the chunk graph it had before the fixture
         existed. Its route is `/control-fixture.html` on the editor preview. -->
    <style>
      /* The page shape `index.html` gives the real editor, and for the same
         reason: `.editor-shell` sets `min-height: 100%`, and an unlayered rule
         beats a Tailwind `min-h-screen` whatever its specificity, so the shell
         needs a parent with a height. Without it the capture shows the fixture
         floating on a blank page rather than filling a surface. */
      html,
      body,
      #control-fixture {
        margin: 0;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="control-fixture"></div>
    <script type="module" src="/src/control-fixture.tsx"></script>
  </body>
</html>
