<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      Mobile fullscreen and keeping the screen awake are browser-dependent.
      viewport-fit=cover keeps the artboard edge-to-edge on notched phones; the
      fit/fill transform is applied by the renderer, never by CSS reflow (§57).
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>Yunari</title>
    <!-- What makes this display installable, and `display: standalone` in it
         is what draws without browser chrome on a client with no fullscreen
         API (vg-577). The worker it points at is registered from
         `src/service-worker.ts`. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- The display is its own document, so it needs its own copy of the mark:
         without a link the browser probes `/favicon.ico` and logs a 404 on
         every load. Kept in step by hand with the editor's, which is the same
         file. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      /* The display is one column: the chrome's two bands, and the artboard
         between them. The bands anchor the strips, but no strip is laid out in
         one: every strip is `position:fixed` (`chrome.ts`), so an empty band is
         zero tall and the artboard gets the whole viewport. A strip in flow
         would take room from the artboard, re-fit the scene and move the whole
         picture (vg-028). */
      body {
        display: flex;
        flex-direction: column;
      }
      [data-yunari-chrome] {
        flex: 0 0 auto;
      }
      /* Artboard host. The renderer applies one uniform transform to all
         content (§51); this element must not impose its own layout, and it is
         what is left of the column. */
      #artboard {
        flex: 1 1 auto;
        min-height: 0;
        position: relative;
      }
      /* The dimmer and the controls (`display-controls.ts`). Both are fixed, so
         neither is a row of the column above and neither can re-fit the scene:
         a control in flow takes its room from the artboard, which is what
         moved the whole picture in vg-028. They are drawn here rather than
         injected by the module because a stylesheet belongs to the document
         that declares the layout, and because the module is then a script with
         no colours in it. */
      [data-yunari-dimmer] {
        position: fixed;
        inset: 0;
        background: #000;
        /* The reader's finger belongs to the composition underneath: this is a
           filter, not a surface. */
        pointer-events: none;
        /* Above the artboard and the flashing strips (chrome.ts's z-index: 1),
           below the controls. Dimming a notice too is what a dimmer does. */
        z-index: 2;
      }
      [data-yunari-controls] {
        position: fixed;
        /* The insets keep the bar inside a notched phone's cutout and its
           rounded corner, the same reason the strips use env() in chrome.ts. */
        top: calc(8px + env(safe-area-inset-top));
        right: calc(8px + env(safe-area-inset-right));
        z-index: 3;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 6px;
        /* Shown and hidden by the module, which is what the transition is for. */
        transition: opacity 180ms ease-out;
        font: 12px/1.4 ui-monospace, monospace;
        color: #e8ecf3;
      }
      [data-yunari-controls] > div {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 8px;
        border-radius: 10px;
        background: rgba(20, 22, 28, 0.72);
      }
      [data-yunari-controls] button {
        padding: 6px 10px;
        border: 0;
        border-radius: 6px;
        background: rgba(232, 236, 243, 0.14);
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      [data-yunari-controls] button[aria-pressed="true"] {
        background: rgba(232, 236, 243, 0.86);
        color: #14161c;
      }
      /* Asked for and not held: amber, the warning the availability strip
         already uses, because the reader has to be able to tell this from off. */
      [data-yunari-controls] button[data-yunari-waiting] {
        background: rgba(255, 206, 106, 0.7);
        color: #3a2a00;
      }
      [data-yunari-controls] button[data-yunari-unavailable] {
        opacity: 0.55;
      }
      [data-yunari-controls] input[type="range"] {
        width: 84px;
        accent-color: #e8ecf3;
      }
      [data-yunari-controls] [data-yunari-controls-say] {
        max-width: 17em;
        margin: 0;
        padding: 6px 8px;
        border-radius: 10px;
        background: rgba(20, 22, 28, 0.72);
        color: #c3cde3;
        text-align: right;
      }
      [data-yunari-controls] [data-yunari-controls-say]:empty {
        display: none;
      }
      [data-yunari-controls] :where(button, input):focus-visible {
        outline: 2px solid #e8ecf3;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div id="yunari-chrome-top" data-yunari-chrome="top"></div>
    <div id="artboard"></div>
    <div id="yunari-chrome-bottom" data-yunari-chrome="bottom"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
