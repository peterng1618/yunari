name = "yunari-store"
main = "src/index.ts"
# 2026-08-22 is the newest date @cloudflare/vitest-pool-workers@0.23.0's bundled workerd supports; Task 5.2 may raise it only if the deploy requires it.
compatibility_date = "2026-08-22"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "yunari-store"
# PLACEHOLDER: the owner pastes the id `npx wrangler d1 create yunari-store`
# prints here (README.md step 2). Do not invent one; a wrong id deploys against
# the wrong or a missing database.
database_id = "00000000-0000-0000-0000-000000000000"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "yunari-store-packages"

[vars]
# No secrets here. BETTER_AUTH_SECRET, the OAuth pairs, OWNER_EMAILS and
# MIGRATE_TOKEN are `wrangler secret put` values. Uploads are proxied through
# the Worker, so R2 needs only the binding above.
# The owner replaces this placeholder with the URL `npx wrangler deploy` prints,
# then deploys again (README.md step 5).
BETTER_AUTH_URL = "https://yunari-store.workers.dev"
