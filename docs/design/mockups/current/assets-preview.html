<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yunari editor — asset preview</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0b0e12; font: 12px system-ui, -apple-system, 'Segoe UI', sans-serif; }
</style>
</head>
<body>
<!-- An image or video preview, opened from Preview on its asset row. It shares
     the theme viewer's shape — no title bar, a fixed stage taking every pixel the
     facts do not, and a 270px right panel holding the metadata and the commands —
     but not its size: it opens almost fullscreen, at the finder's inset-24 box,
     because the asset is judged at the size it will be used, not read as a row.
     A band under the stage would spend the media's own height; a portrait image
     or video needs that height more than the preview can spare width.

     The panel is stacked tight — badges, pills, then the eligible commands in a
     two-column foot, each a Lucide glyph plus one word so four fit 270px.
     One modal for both kinds: a video replaces the still with a
     player and drops Place; Background becomes its primary.
     Remove is destructive and says so in --hot; the rest are equal-weight verbs. -->
<div style="--bg:#0b0e12;--hdr:#12161c;--panel:#12161c;--panel2:#171c23;--edge:#242b34;--edge2:#1b212a;
            --text:#e8ecf3;--muted:#8a97ab;--faint:#5a6675;--accent:#72e0c0;--hot:#ff7e6e;--warn:#f3aa64;
            min-height:100vh;background:var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;padding:24px">

  <div style="width:min(1132px,calc(100vw - 48px));height:min(852px,calc(100vh - 48px));display:flex;border:1px solid var(--edge);border-radius:8px;background:var(--panel);box-shadow:0 24px 60px #000000b3;overflow:hidden">

    <!-- the stage: the file contained, fixed, nothing cropped -->
    <div style="flex:1;min-width:0;position:relative;background:#080a0d;display:flex;align-items:center;justify-content:center;padding:20px">
      <span style="width:100%;max-height:100%;aspect-ratio:3/2;border-radius:6px;background:linear-gradient(150deg,#3d3242,#241f2c 55%,#4b3347)"></span>
      <span style="position:absolute;left:16px;bottom:12px;padding:3px 8px;border-radius:4px;background:#0d1116cc;font:400 10px/1.3 ui-monospace,Menlo,monospace;color:var(--muted)">2400 × 1600 · fit</span>
    </div>

    <div style="width:270px;flex:0 0 auto;border-left:1px solid var(--edge);background:var(--panel);display:flex;flex-direction:column">

      <div style="flex:0 0 auto;padding:14px 16px 12px;border-bottom:1px solid var(--edge)">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font:600 15px/1.3 system-ui;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">studio.png</span>
          <span style="flex:0 0 auto;font:500 10px/1.2 system-ui;color:var(--muted);border:1px solid var(--edge);border-radius:999px;padding:3px 7px">Image</span>
          <span style="flex:1"></span>
          <span style="flex:0 0 auto;width:26px;height:26px;border-radius:6px;border:1px solid var(--edge);display:flex;align-items:center;justify-content:center">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="1.8"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </span>
        </div>
        <div style="display:flex;align-items:center;gap:8px;margin-top:6px">
          <span style="font:500 10px/1.2 system-ui;color:var(--faint);border:1px solid var(--edge);border-radius:999px;padding:3px 7px">Unused</span>
          <span style="flex:1"></span>
          <span style="font:400 10px/1.3 ui-monospace,Menlo,monospace;color:var(--faint)">840 KB · 2026-10-25</span>
        </div>
      </div>

      <div style="flex:1;overflow:auto;padding:12px 16px;display:flex;flex-direction:column;gap:12px">
        <span style="font:400 11px/1.45 system-ui;color:var(--muted)">A local file. Nothing on the canvas and no type preset refers to it.</span>

        <span style="display:flex;flex-direction:column;gap:5px">
          <span style="font:600 9.5px/1.2 system-ui;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)">File</span>
          <span style="display:flex;flex-wrap:wrap;gap:5px">
            <span style="font:500 10.5px/1.3 system-ui;color:var(--text);background:var(--panel2);border:1px solid var(--edge);border-radius:999px;padding:3px 8px">PNG image</span>
            <span style="font:500 10.5px/1.3 system-ui;color:var(--text);background:var(--panel2);border:1px solid var(--edge);border-radius:999px;padding:3px 8px">Local file</span>
          </span>
        </span>

        <span style="display:flex;flex-direction:column;gap:5px">
          <span style="font:600 9.5px/1.2 system-ui;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)">Shape</span>
          <span style="display:flex;flex-wrap:wrap;gap:5px">
            <span style="font:500 10.5px/1.3 ui-monospace,Menlo,monospace;color:var(--text);background:var(--panel2);border:1px solid var(--edge);border-radius:999px;padding:3px 8px">2400×1600</span>
            <span style="font:500 10.5px/1.3 system-ui;color:var(--text);background:var(--panel2);border:1px solid var(--edge);border-radius:999px;padding:3px 8px">3:2</span>
          </span>
        </span>

        <span style="display:flex;flex-direction:column;gap:5px">
          <span style="font:600 9.5px/1.2 system-ui;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)">Attribution</span>
          <span style="display:flex;flex-wrap:wrap;gap:5px">
            <span style="font:500 10.5px/1.3 system-ui;color:var(--muted);background:var(--panel2);border:1px dashed var(--edge);border-radius:999px;padding:3px 8px">None recorded</span>
          </span>
        </span>

        <span style="display:flex;flex-direction:column;gap:3px;padding-top:2px;border-top:1px solid var(--edge2);font:400 10px/1.4 system-ui;color:var(--faint)">
          <span>Used by nothing</span>
          <span>Remove goes to the Recycle Bin on save</span>
        </span>
      </div>

      <div style="flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:12px 16px;border-top:1px solid var(--edge)">
        <span style="display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--edge);border-radius:6px;background:var(--panel2);padding:5px 8px;font:400 11px/1.4 system-ui;color:var(--hot)">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--hot)" stroke-width="1.8" style="flex:0 0 auto"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/><path d="M10 11v5M14 11v5"/></svg>
          Remove</span>
        <span style="display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--edge);border-radius:6px;background:var(--panel2);padding:5px 8px;font:400 11px/1.4 system-ui">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="1.8" style="flex:0 0 auto"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
          Replace</span>
        <span style="display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--edge);border-radius:6px;background:var(--panel2);padding:5px 8px;font:400 11px/1.4 system-ui">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="1.8" style="flex:0 0 auto"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m3 15 5-4 4 4 3-3 6 5"/></svg>
          Background</span>
        <span style="display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--edge);border-radius:6px;background:var(--panel2);padding:5px 8px;font:400 11px/1.4 system-ui">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="1.8" style="flex:0 0 auto"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 8v8M8 12h8"/></svg>
          Place</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
